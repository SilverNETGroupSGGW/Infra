name: Deploy to Docker Compose

on:
    push:
        branches:
            - main
    workflow_call:
        inputs:
            image:
                description: "Optional Docker image to deploy (format: ghcr.io/owner/repo[:tag])"
                required: false
                type: string
        secrets:
            REPO_GITHUB_TOKEN:
                required: true

concurrency:
    group: deploy-docker-compose

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Tailscale
              uses: tailscale/github-action@v4
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:gha-silver

            - name: Deploy to server
              uses: appleboy/ssh-action@v1
              with:
                  username: silver
                  host: quicksilver
                  password: TAILSCALE_MANAGED
                  script: |
                      set -e

                      # Configure git authentication
                      git config --global credential.helper store
                      echo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com" > ~/.git-credentials

                      if [ ! -d ~/Infra ]; then
                          git clone https://github.com/SilverNETGroupSGGW/Infra
                      fi

                      cd ~/Infra

                      # Pull latest changes
                      git pull

                      # Login to GitHub Container Registry
                      echo "${{ secrets.REPO_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

                      # Pull and deploy services
                      if [ -n "${{ inputs.image }}" ]; then
                              docker pull "${{ inputs.image }}"
                      fi
                      docker compose up -d
                      docker image prune -f
