name: Deploy to Docker Compose

on:
    push:
        branches:
            - main
    repository_dispatch:
        types: [deploy]

concurrency:
    group: deploy-docker-compose

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Tailscale
              uses: tailscale/github-action@v4
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:gha-silver

            - name: Deploy to server
              uses: appleboy/ssh-action@v1
              with:
                  username: silver
                  host: quicksilver
                  password: TAILSCALE_MANAGED
                  script: |
                      # Configure git authentication
                      git config --global credential.helper store
                      echo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com" > ~/.git-credentials

                      if [ ! -d ~/Infra ]; then
                          git clone https://github.com/SilverNETGroupSGGW/Infra
                      fi
  
                      cd ~/Infra

                      # Pull latest changes
                      git pull

                      # Login to GitHub Container Registry
                      echo "${{ github.event.client_payload.GITHUB_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

                      # Pull and deploy services
                      docker-compose pull ${{ github.event.client_payload.image || '' }}
                      docker-compose up -d
                      docker image prune -f
