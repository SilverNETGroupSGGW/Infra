name: Deploy to Docker Compose

# Updates the Compose services on the server (docs/deploy.md): on changes to
# the services, and on a `deploy` repository dispatch from an image's build,
# which names the image to pull in `client_payload.image`.

on:
  push:
    branches:
      - main
    paths:
      - compose.yaml
      - .github/workflows/deploy.yaml
  repository_dispatch:
    types: [deploy]

permissions: {}

concurrency:
  group: deploy-docker-compose

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # the server pulls this repository with the job's token
    steps:
      - name: Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-silver

      - name: Deploy to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          # Passed as variables, never expanded into the script.
          IMAGE: ${{ github.event.client_payload.image }}
          GIT_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.PAT }}
        with:
          username: silver
          host: quicksilver
          password: TAILSCALE_MANAGED
          envs: IMAGE,GIT_TOKEN,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu

            if [ -n "$IMAGE" ] && ! printf '%s\n' "$IMAGE" | grep -Eq '^ghcr\.io/silvernetgroupsggw/[a-z0-9._/-]+(:[A-Za-z0-9._-]+)?$'; then
              echo "Not an image of the organization: $IMAGE" >&2
              exit 1
            fi

            if [ ! -d ~/Infra ]; then
              git clone https://github.com/SilverNETGroupSGGW/Infra ~/Infra
            fi
            cd ~/Infra
            # The token only lives for this command, not in a credential store.
            git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)" pull --ff-only

            printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            if [ -n "$IMAGE" ]; then
              docker pull "$IMAGE"
            else
              docker compose pull
            fi
            docker compose up -d
            docker image prune -f
