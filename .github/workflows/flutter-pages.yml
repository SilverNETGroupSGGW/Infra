name: Flutter web on GitHub Pages

# Reusable: serves the newest release at the site root, the newest build of
# any kind under /beta/. Release runs deploy from their tag: allow the tag rule "*".

on:
  workflow_call:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble the site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # read the releases and their web builds
      pages: read # configure-pages reads the site's base path
    steps:
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Download the web builds
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # Releases and pre-releases with a web build, newest first, as
          # "<tag> <prerelease>".
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[]
            | select((.draft | not) and any(.assets[]; .name | endswith("-web.zip")))
            | "\(.tag_name) \(.prerelease)"' > releases.txt
          beta=$(awk 'NR == 1 { print $1 }' releases.txt)
          prod=$(awk '$2 == "false" { print $1; exit }' releases.txt)
          if [ -z "$beta" ]; then
            echo "::error::No release has a web build yet."
            exit 1
          fi
          # The web builds are made for "/"; point them at their path on the site.
          unpack() {
            mkdir -p "$2"
            gh release download "$1" --repo "$GITHUB_REPOSITORY" \
              --pattern '*-web.zip' --output web.zip --clobber
            unzip -q web.zip -d "$2"
            rm web.zip
            sed -i "s|<base href=\"/\">|<base href=\"$3\">|" "$2/index.html"
          }
          if [ -n "$prod" ]; then
            unpack "$prod" _site "${BASE_PATH}/"
            # A promoted beta was built with the BETA badge; production has none.
            sed -i '/<!-- beta-badge/,/<!-- \/beta-badge -->/d' _site/index.html
          else
            mkdir _site
            echo '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=beta/">' \
              > _site/index.html
          fi
          unpack "$beta" _site/beta "${BASE_PATH}/beta/"
          echo "Production: ${prod:-none}, beta: $beta" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publish the site
      id-token: write # authenticate the Pages deployment (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
