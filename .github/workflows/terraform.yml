name: Terraform

# Applies terraform/apps (the apps' store release setup) from main. The plan
# job runs on its own and lists the changing resources in the run summary; the
# apply job runs in the `terraform` environment, whose reviewers approve it
# after reading that list. The repository is public, so attribute values stay
# out of the logs and the summary, and the saved plan travels encrypted with a
# key derived per run from the GitHub App key. Only this workflow on main can
# sign in as the Terraform service account (terraform/bootstrap). HCP
# Terraform keeps the state.

on:
  push:
    branches: [main]
    paths:
      - terraform/**
      - .github/workflows/terraform.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # clone the repository
      id-token: write # sign in to Google Cloud (Workload Identity Federation)
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    env:
      # TF_VAR_apps_folder_id: ${{ vars.TF_APPS_FOLDER_ID }} (with the Google Cloud organization)
      TF_VAR_github_app_id: ${{ vars.TF_GITHUB_APP_ID }}
      TF_VAR_github_app_installation_id: ${{ vars.TF_GITHUB_APP_INSTALLATION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: terraform
          cache: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.TF_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TF_GOOGLE_SERVICE_ACCOUNT }}
      - name: Write the GitHub App key
        env:
          KEY: ${{ secrets.TF_GITHUB_APP_PRIVATE_KEY }}
        run: |
          umask 077
          file="$RUNNER_TEMP/github-app.pem"
          printf '%s\n' "${KEY:?Set the TF_GITHUB_APP_PRIVATE_KEY repository secret}" > "$file"
          echo "TF_VAR_github_app_private_key_file=$file" >> "$GITHUB_ENV"
      - id: plan
        name: Plan
        working-directory: terraform/apps
        env:
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_HCP_TOKEN }}
        run: |
          terraform init
          status=0
          # Errors still reach the log; the plan itself only the summary below.
          terraform plan -detailed-exitcode -no-color -out=tfplan > /dev/null || status=$?
          [ "$status" -ne 1 ] || exit 1
          echo "changes=$([ "$status" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo '| Action | Resource |'
            echo '| --- | --- |'
            terraform show -json tfplan | jq -r '
              .resource_changes[]
              | (.change.actions | join(", ")) as $actions
              | select($actions != "no-op" or .change.importing)
              | "| \(if .change.importing then "import" + (if $actions == "no-op" then "" else ", " + $actions end) else $actions end) | `\(.address)` |"'
            echo
            terraform show -no-color tfplan | grep -E '^(Plan|No changes)' || true
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ steps.plan.outputs.changes == 'true' }}
        name: Encrypt the plan
        working-directory: terraform/apps
        env:
          # The key is derived for this run from a secret both jobs already
          # have, so the plan needs no secret of its own.
          APP_KEY: ${{ secrets.TF_GITHUB_APP_PRIVATE_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 -c 'import hashlib, hmac, os, sys; sys.stdout.write(hmac.new(os.environ["APP_KEY"].encode(), ("tfplan " + os.environ["RUN_ID"]).encode(), hashlib.sha256).hexdigest())' |
            gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
              --symmetric --cipher-algo AES256 --output tfplan.gpg tfplan
          rm tfplan
      - if: ${{ steps.plan.outputs.changes == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan
          path: terraform/apps/tfplan.gpg
          # Encrypted, so it can wait for the approval.
          retention-days: 7
          if-no-files-found: error

  apply:
    name: Apply
    needs: plan
    if: ${{ needs.plan.outputs.changes == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: terraform
    permissions:
      contents: read # clone the repository
      id-token: write # sign in to Google Cloud (Workload Identity Federation)
    env:
      # TF_VAR_apps_folder_id: ${{ vars.TF_APPS_FOLDER_ID }} (with the Google Cloud organization)
      TF_VAR_github_app_id: ${{ vars.TF_GITHUB_APP_ID }}
      TF_VAR_github_app_installation_id: ${{ vars.TF_GITHUB_APP_INSTALLATION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: terraform
          cache: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.TF_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TF_GOOGLE_SERVICE_ACCOUNT }}
      - name: Write the GitHub App key
        env:
          KEY: ${{ secrets.TF_GITHUB_APP_PRIVATE_KEY }}
        run: |
          umask 077
          file="$RUNNER_TEMP/github-app.pem"
          printf '%s\n' "$KEY" > "$file"
          echo "TF_VAR_github_app_private_key_file=$file" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan
          path: terraform/apps
      - name: Decrypt the plan
        working-directory: terraform/apps
        env:
          APP_KEY: ${{ secrets.TF_GITHUB_APP_PRIVATE_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 -c 'import hashlib, hmac, os, sys; sys.stdout.write(hmac.new(os.environ["APP_KEY"].encode(), ("tfplan " + os.environ["RUN_ID"]).encode(), hashlib.sha256).hexdigest())' |
            gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
              --decrypt --output tfplan tfplan.gpg
      - name: Apply
        working-directory: terraform/apps
        env:
          TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_HCP_TOKEN }}
        run: |
          terraform init
          # Only the result reaches the log; errors still do.
          terraform apply -no-color tfplan | grep -E '^Apply complete!'
