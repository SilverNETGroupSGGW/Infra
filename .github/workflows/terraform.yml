name: Terraform

# Applies terraform/apps (the apps' store release setup) from main. Both jobs
# run in the `terraform` environment, whose reviewers approve the plan job and,
# after reading its plan in the run summary, the apply job. Only this workflow
# on main in that environment can sign in as the Terraform service account
# (terraform/bootstrap).

on:
  push:
    branches: [main]
    paths:
      - terraform/**
      - .github/workflows/terraform.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: terraform
    permissions:
      contents: read # clone the repository
      id-token: write # sign in to Google Cloud (Workload Identity Federation)
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    env:
      # TF_VAR_releases_folder_id: ${{ vars.TF_RELEASES_FOLDER_ID }} (with the Google Cloud organization)
      TF_VAR_github_app_id: ${{ vars.TF_GITHUB_APP_ID }}
      TF_VAR_github_app_installation_id: ${{ vars.TF_GITHUB_APP_INSTALLATION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: terraform
          cache: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.TF_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TF_GOOGLE_SERVICE_ACCOUNT }}
      - name: Write the GitHub App key
        env:
          KEY: ${{ secrets.TF_GITHUB_APP_PRIVATE_KEY }}
        run: |
          umask 077
          file="$RUNNER_TEMP/github-app.pem"
          printf '%s\n' "${KEY:?Set the TF_GITHUB_APP_PRIVATE_KEY secret of the terraform environment}" > "$file"
          echo "TF_VAR_github_app_private_key_file=$file" >> "$GITHUB_ENV"
      - id: plan
        name: Plan
        working-directory: terraform/apps
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init -backend-config="bucket=$STATE_BUCKET"
          status=0
          terraform plan -detailed-exitcode -out=tfplan || status=$?
          [ "$status" -ne 1 ] || exit 1
          echo "changes=$([ "$status" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ steps.plan.outputs.changes == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan
          path: terraform/apps/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply
    needs: plan
    if: ${{ needs.plan.outputs.changes == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: terraform
    permissions:
      contents: read # clone the repository
      id-token: write # sign in to Google Cloud (Workload Identity Federation)
    env:
      # TF_VAR_releases_folder_id: ${{ vars.TF_RELEASES_FOLDER_ID }} (with the Google Cloud organization)
      TF_VAR_github_app_id: ${{ vars.TF_GITHUB_APP_ID }}
      TF_VAR_github_app_installation_id: ${{ vars.TF_GITHUB_APP_INSTALLATION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: terraform
          cache: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.TF_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TF_GOOGLE_SERVICE_ACCOUNT }}
      - name: Write the GitHub App key
        env:
          KEY: ${{ secrets.TF_GITHUB_APP_PRIVATE_KEY }}
        run: |
          umask 077
          file="$RUNNER_TEMP/github-app.pem"
          printf '%s\n' "$KEY" > "$file"
          echo "TF_VAR_github_app_private_key_file=$file" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan
          path: terraform/apps
      - name: Apply
        working-directory: terraform/apps
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          terraform init -backend-config="bucket=$STATE_BUCKET"
          terraform apply tfplan
