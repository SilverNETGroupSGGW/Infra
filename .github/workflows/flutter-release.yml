name: Flutter release

# Reusable: builds a release of a Flutter app and publishes it to the stores
# and Pages; a pre-release goes to open testing, a release to production.
# Infra's app-store.yml signs, uploads and submits the iOS build.

on:
  workflow_call:
    inputs:
      app-dir:
        description: Directory of the Flutter app (the one with pubspec.yaml), relative to the repository root.
        type: string
        default: .
      artifact-prefix:
        description: File name prefix of the release assets, e.g. `my-app` for my-app-1.2.0.aab.
        type: string
        default: ${{ github.event.repository.name }}
      android-keystore-path:
        description: Where the build expects the upload keystore, relative to app-dir.
        type: string
        default: android/app/key.jks
      play-beta-track:
        description: API name of the Google Play open testing track; Google names it `beta`, and other names are closed tracks.
        type: string
        default: beta
      publish-track:
        description: "Manual runs from a release's tag: `production` or the open testing track (play-beta-track)."
        type: string
      publish-platforms:
        description: "Manual runs: `all` (the default), `android` or `ios`."
        type: string
      play-notes-language:
        description: Language of the Google Play release notes; one of the store listing's languages.
        type: string
        default: en-US
      pages:
        description: Deploy the web builds to GitHub Pages once Pages is enabled for the repository.
        type: boolean
      environment:
        description: Environment of the jobs that use signing or store credentials; empty for none.
        type: string
      build-tools:
        description: mise tools that the Android and web builds install (MISE_ENABLE_TOOLS).
        type: string
        default: flutter,java
      mise-version:
        description: The mise version to install; empty (the default) installs the newest release.
        type: string
      macos-runner:
        description: Runner label of the iOS jobs.
        type: string
        default: macos-26
      xcode-version:
        description: Xcode version of the iOS jobs, as installed on the runner (/Applications/Xcode_<version>.app).
        type: string
        default: "26.6"
    secrets:
      ANDROID_KEYSTORE_BASE64:
        description: The upload keystore (`base64 -w0 key.jks`).
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false

permissions: {}

# Release runs must not restore anything from the Actions cache; the jobs also
# turn their own caches off.
cache-mode: none

jobs:
  plan:
    name: Check the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check the release's builds and the version's other tags
    outputs:
      mode: ${{ steps.version.outputs.mode }}
      manual: ${{ steps.version.outputs.manual }}
      channel: ${{ steps.version.outputs.channel }}
      play-track: ${{ steps.version.outputs.play-track }}
      android: ${{ steps.version.outputs.android }}
      ios: ${{ steps.version.outputs.ios }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
      number: ${{ steps.version.outputs.number }}
      build-number: ${{ steps.version.outputs.build-number }}
      android-package: ${{ steps.app.outputs.android-package }}
      bundle-id: ${{ steps.app.outputs.bundle-id }}
      apple-app-id: ${{ steps.app.outputs.apple-app-id }}
    steps:
      # The store IDs come from apps.yaml at the Infra commit the caller pinned.
      # A convenience, not the guard: each repository's Google account can only
      # release its own package, whatever commit it pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .infra
          persist-credentials: false
          sparse-checkout: |
            apps.yaml
            scripts
      - id: app
        name: Look up the app in apps.yaml
        env:
          SHA: ${{ job.workflow_sha }}
        run: |
          yq -o=json .infra/apps.yaml > "$RUNNER_TEMP/apps.json"
          app=$(python3 .infra/scripts/apps.py lookup "$RUNNER_TEMP/apps.json" --repository-id "$GITHUB_REPOSITORY_ID")
          echo "$app" >> "$GITHUB_OUTPUT"
          if grep -qx found=false <<< "$app"; then
            echo "::warning::$GITHUB_REPOSITORY ($GITHUB_REPOSITORY_ID) is not in apps.yaml at $SHA: no store publishing. Add it in Infra and pin a newer commit."
          fi
      - id: version
        name: Read the version from the tag
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          TRACK: ${{ inputs.publish-track }}
          PLATFORMS: ${{ inputs.publish-platforms }}
          BETA_TRACK: ${{ inputs.play-beta-track }}
          PREFIX: ${{ inputs.artifact-prefix }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT/$REF_TYPE" in
            release/* | workflow_dispatch/tag) ;;
            workflow_dispatch/*)
              echo "::error::Run the workflow from the tag of the release to publish (\"Use workflow from\" or --ref)."
              exit 1
              ;;
            *)
              echo "::error::Call this workflow from a workflow that runs on release events (and on workflow_dispatch to publish a release again)."
              exit 1
              ;;
          esac
          # [v]X.Y.Z, or [v]X.Y.Z-<label><N> such as 1.2.0-beta.3 or 1.2.0-rc2;
          # the label is free text, only N counts.
          semver='^v?(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)(-([0-9A-Za-z.-]*[A-Za-z.-])?([1-9][0-9]?))?$'
          if [[ ! $TAG =~ $semver ]] || ((BASH_REMATCH[1] > 2099 || BASH_REMATCH[6] > 98)); then
            echo "::error::$TAG is not a version tag: X.Y.Z, or X.Y.Z-beta.N for a pre-release (optional leading v; X up to 2099, Y, Z up to 99, N from 1 to 98)."
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          pre=${BASH_REMATCH[4]}
          number=${BASH_REMATCH[6]}
          label=${BASH_REMATCH[5]%[.-]}
          # A release (99) sorts after its pre-releases:
          # 1.2.3-beta.4 builds 1020304, 1.2.3 builds 1020399.
          build_number=$((BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 10000 + BASH_REMATCH[3] * 100 + ${BASH_REMATCH[6]:-99}))
          manual=false android=true ios=true
          if [ "$EVENT" = workflow_dispatch ]; then
            # Publishes the builds that the release's run uploaded to the stores.
            manual=true mode=promote play_track=$TRACK
            case "$TRACK" in
              production) channel=prod ;;
              "$BETA_TRACK") channel=beta ;;
              *)
                echo "::error::publish-track is production or $BETA_TRACK, not '$TRACK'; publish to other tracks in the store consoles."
                exit 1
                ;;
            esac
            case "$PLATFORMS" in
              all | "") ;;
              android) ios=false ;;
              ios) android=false ;;
              *)
                echo "::error::publish-platforms is all, android or ios, not $PLATFORMS."
                exit 1
                ;;
            esac
            if [ "$android$ios" = falsefalse ]; then
              echo "::error::Nothing to publish."
              exit 1
            fi
          else
            assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            built=false
            if grep -qxF -e "$PREFIX-$TAG.aab" -e "$PREFIX-${TAG%%-*}.aab" <<< "$assets"; then built=true; fi
            # The pre-release checkbox picks the testers, not the tag.
            case "$ACTION/$PRERELEASE" in
              published/true)
                # "Re-run all jobs" would build again; the stores refuse a build number twice.
                if [ "$built" = true ]; then
                  echo "::error::$TAG already has its builds; use \"Re-run failed jobs\" to continue its run."
                  exit 1
                fi
                mode=build channel=beta play_track=$BETA_TRACK
                ;;
              published/false)
                mode=skip channel=prod
                echo "::notice::GitHub also sends \"released\" for a release; that run publishes $TAG."
                ;;
              released/*)
                # Sent for a new release and for a pre-release turned into one;
                # only the second has a beta's builds to promote.
                channel=prod play_track=production
                if [ "$built" = true ]; then mode=promote; else mode=build; fi
                ;;
              *)
                echo "::error::Unexpected release action $ACTION."
                exit 1
                ;;
            esac
          fi
          # A pre-release needs its own N among the version's pre-releases, and none
          # can follow the version's own tag (N = 99).
          if [ "$mode" = build ] && [ -n "$pre" ]; then
            refs='.[].ref | ltrimstr("refs/tags/")'
            others=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$version" --jq "$refs" &&
              gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$version" --jq "$refs")
            for other in $others; do
              # The prefix 1.2.1 also matches 1.2.10.
              [ "$other" != "$TAG" ] && [[ $other =~ $semver ]] || continue
              [ "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" = "$version" ] || continue
              if [ -z "${BASH_REMATCH[4]}" ]; then
                echo "::error::$other is already tagged, so the stores take no more builds of $version. Delete this release and tag a higher version."
                exit 1
              fi
              if [ "${BASH_REMATCH[6]}" = "$number" ]; then
                echo "::error::$other already has build number $build_number: the pre-releases of a version need different numbers (beta.1, beta.2, rc.3). Delete this release and publish it again with a new tag."
                exit 1
              fi
            done
          fi
          {
            echo "mode=$mode"
            echo "manual=$manual"
            echo "channel=$channel"
            echo "play-track=$play_track"
            echo "android=$android"
            echo "ios=$ios"
            echo "tag=$TAG"
            echo "version=$version"
            echo "label=$label"
            echo "number=$number"
            echo "build-number=$build_number"
          } >> "$GITHUB_OUTPUT"
          echo "$TAG: $mode ($channel, Google Play track $play_track), version $version, build $build_number" >> "$GITHUB_STEP_SUMMARY"
      # Fail before any build when the signing is half set up. Secrets kept in
      # an environment only reach the jobs that name it; those jobs check them.
      - if: ${{ steps.version.outputs.mode != 'skip' }}
        name: Check the signing settings and the iOS runner
        env:
          BUILD: ${{ steps.version.outputs.mode == 'build' }}
          ANDROID_SIGNING: >-
            ${{ inputs.environment != '' || secrets.ANDROID_KEYSTORE_BASE64 != ''
            && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != ''
            && secrets.ANDROID_STORE_PASSWORD != '' }}
          MACOS_RUNNER: ${{ inputs.macos-runner }}
          XCODE_VERSION: ${{ inputs.xcode-version }}
        run: |
          status=0
          fail() { echo "::error::$1"; status=1; }
          if [ "$BUILD" = true ] && [ "$ANDROID_SIGNING" != true ]; then
            fail "Pass the ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD and ANDROID_STORE_PASSWORD secrets to sign the Android builds."
          fi
          # They become the iOS archive's runs-on and DEVELOPER_DIR.
          if [[ ! $MACOS_RUNNER =~ ^macos-[0-9a-z.-]+$ ]]; then
            fail "macos-runner is a GitHub macOS runner label such as macos-26, not '$MACOS_RUNNER'."
          fi
          if [[ ! $XCODE_VERSION =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            fail "xcode-version is a version such as 26.6, not '$XCODE_VERSION'."
          fi
          exit "$status"

  android:
    name: Android
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'build' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: read # clone the repository
    env:
      MISE_ENABLE_TOOLS: ${{ inputs.build-tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ inputs.mise-version }}
          cache: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Set the version from the tag
        working-directory: ${{ inputs.app-dir }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}+${{ needs.plan.outputs.build-number }}
        run: |
          sed -i.bak '/^version:/d' pubspec.yaml && rm pubspec.yaml.bak
          printf '\nversion: %s\n' "$VERSION" >> pubspec.yaml
      - name: Install the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ inputs.app-dir }}/${{ inputs.android-keystore-path }}
        run: |
          : "${KEYSTORE_BASE64:?Pass the ANDROID_KEYSTORE_BASE64 secret}"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
      - name: Build the APKs and the App Bundle
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # Without them the app's build would fall back to the debug key.
          : "${KEY_ALIAS:?Pass the ANDROID_KEY_ALIAS secret}"
          : "${KEY_PASSWORD:?Pass the ANDROID_KEY_PASSWORD secret}"
          : "${STORE_PASSWORD:?Pass the ANDROID_STORE_PASSWORD secret}"
          mise run build:apk
          mise run build:appbundle
      - name: Name the builds
        env:
          APP_DIR: ${{ inputs.app-dir }}
          PREFIX: ${{ inputs.artifact-prefix }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          out="$APP_DIR/build/app/outputs"
          mkdir -p dist
          for apk in "$out"/flutter-apk/app-*-release.apk; do
            abi=$(basename "$apk" -release.apk)
            cp "$apk" "dist/${PREFIX}-${TAG}-${abi#app-}.apk"
          done
          cp "$out/bundle/release/app-release.aab" "dist/${PREFIX}-${TAG}.aab"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: dist/
          if-no-files-found: error
          retention-days: 1

  web:
    name: Web
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'build' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # clone the repository
    env:
      MISE_ENABLE_TOOLS: ${{ inputs.build-tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ inputs.mise-version }}
          cache: false
      - name: Set the version from the tag
        working-directory: ${{ inputs.app-dir }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}+${{ needs.plan.outputs.build-number }}
        run: |
          sed -i.bak '/^version:/d' pubspec.yaml && rm pubspec.yaml.bak
          printf '\nversion: %s\n' "$VERSION" >> pubspec.yaml
      - name: Build
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: mise run build:web --channel "$CHANNEL"
      - name: Zip the build
        env:
          APP_DIR: ${{ inputs.app-dir }}
          PREFIX: ${{ inputs.artifact-prefix }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          mkdir -p dist
          zip_file="$PWD/dist/${PREFIX}-${TAG}-web.zip"
          (cd "$APP_DIR/build/web" && zip -qr "$zip_file" .)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attach to the release
    needs: [plan, android, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job and rename can write to the repository. The build jobs run
    # third-party build code (Gradle plugins, Dart build hooks); these two run none.
    permissions:
      contents: write # attach the builds to the release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  promote:
    name: Check the release's builds
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'promote' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # read the release
    steps:
      - if: ${{ needs.plan.outputs.manual == 'true' }}
        name: Check that the release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        # The stores check that they have its builds.
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null
      - if: ${{ needs.plan.outputs.manual != 'true' }}
        name: Check that the release workflow built the beta
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ inputs.artifact-prefix }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # The run may have waited for the beta's own run; check the live state.
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" != false ]; then
            echo "::error::$TAG is a pre-release again; not promoting it."
            exit 1
          fi
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          # A re-run finds the builds already renamed after the release.
          for suffix in .aab -web.zip; do
            if ! grep -qxF -e "${PREFIX}-${TAG}${suffix}" -e "${PREFIX}-${TAG%%-*}${suffix}" <<< "$assets"; then
              echo "::error::$TAG has no ${PREFIX}-${TAG}${suffix}; only a beta built by the release workflow can be promoted."
              exit 1
            fi
          done

  rename:
    name: Rename the release
    needs: [plan, promote]
    if: ${{ needs.plan.outputs.manual != 'true' && needs.plan.outputs.number != '' && needs.promote.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # rename the release and its builds
    steps:
      - name: Drop the pre-release label from the names
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          LABEL: ${{ needs.plan.outputs.label }}
          NUMBER: ${{ needs.plan.outputs.number }}
        run: |
          api=repos/$GITHUB_REPOSITORY/releases
          id=$(gh api "$api/tags/$TAG" --jq .id)
          # "App 1.2.0 beta 3" becomes "App 1.2.0", v1.2.0-beta.3 becomes v1.2.0.
          title=$(gh api "$api/$id" --jq .name)
          pattern="^(.*)${VERSION//./\\.}[ ._-]*${LABEL//./\\.}[ ._-]*${NUMBER}([^0-9].*)?$"
          new=
          shopt -s nocasematch
          if [ -z "$title" ]; then
            new=${TAG%%-*} # GitHub shows the tag as the title
          elif [[ $title =~ $pattern ]]; then
            new=${BASH_REMATCH[1]}$VERSION${BASH_REMATCH[2]}
          fi
          shopt -u nocasematch
          if [ -n "$new" ]; then
            gh api -X PATCH "$api/$id" -f name="$new" --silent
          fi
          # The tag keeps the label; the builds are named after the release.
          gh api "$api/$id" --jq '.assets[] | "\(.id) \(.name)"' | while read -r asset name; do
            if [[ $name == *-"$TAG"* ]]; then
              gh api -X PATCH "$api/assets/$asset" -f name="${name/-"$TAG"/-"${TAG%%-*}"}" --silent
            fi
          done

  google-play:
    name: Google Play
    needs: [plan, publish, promote]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.android-package != ''
      && needs.plan.outputs.android == 'true'
      && (needs.publish.result == 'success' || needs.promote.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # The Play Developer API allows one open edit at a time.
    concurrency:
      group: google-play
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read # read the release notes and the scripts
      id-token: write # authenticate to Google Cloud (Workload Identity Federation)
    steps:
      # The job may have waited behind other releases' store jobs: check the
      # live state again before changing anything.
      - if: ${{ needs.plan.outputs.mode == 'promote' && needs.plan.outputs.manual != 'true' }}
        name: Check that the release is still a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" != false ]; then
            echo "::error::$TAG is a pre-release again; not promoting it."
            exit 1
          fi
      # The scripts of the workflow version the caller pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .infra
          persist-credentials: false
          sparse-checkout: scripts
      # From the release, so a re-run works after the run's artifacts expire.
      - if: ${{ needs.plan.outputs.mode == 'build' }}
        name: Download the App Bundle
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ inputs.artifact-prefix }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${PREFIX}-${TAG}.aab" --dir dist
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/389882651708/locations/global/workloadIdentityPools/releases/providers/flutter-release
          # The calling repository's own account: only its tokens can use it, and
          # Play lets it release only its apps.yaml package (sync-apps.yml).
          service_account: app-${{ github.repository_id }}@silvernet-infra.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload or promote
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.plan.outputs.android-package }}
          BUNDLE_PATH: dist/${{ inputs.artifact-prefix }}-${{ needs.plan.outputs.tag }}.aab
          MODE: ${{ needs.plan.outputs.mode }}
          TRACK: ${{ needs.plan.outputs.play-track }}
          BETA_TRACK: ${{ inputs.play-beta-track }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION_CODE: ${{ needs.plan.outputs.build-number }}
          NOTES_LANGUAGE: ${{ inputs.play-notes-language }}
        run: python3 .infra/scripts/google_play.py

  ios-archive:
    name: iOS archive
    needs: plan
    if: ${{ needs.plan.outputs.mode == 'build' && needs.plan.outputs.bundle-id != '' }}
    runs-on: ${{ inputs.macos-runner }}
    timeout-minutes: 60
    permissions:
      contents: read # clone the repository
    outputs:
      push: ${{ steps.pack.outputs.push }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode-version }}.app/Contents/Developer
      MISE_ENABLE_TOOLS: flutter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the export compliance answer
        working-directory: ${{ inputs.app-dir }}
        env:
          ANSWER: ${{ vars.APP_STORE_USES_NON_EXEMPT_ENCRYPTION }}
        run: |
          case "$ANSWER" in
            true | false) exit 0 ;;
            "") if grep -q ITSAppUsesNonExemptEncryption ios/Runner/Info.plist; then exit 0; fi ;;
          esac
          echo "::error::TestFlight and App Review need the export compliance answer: set the APP_STORE_USES_NON_EXEMPT_ENCRYPTION variable to false or true, or add ITSAppUsesNonExemptEncryption to ios/Runner/Info.plist."
          exit 1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: ${{ inputs.mise-version }}
          cache: false
      - name: Set the version from the tag
        working-directory: ${{ inputs.app-dir }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}+${{ needs.plan.outputs.build-number }}
        run: |
          sed -i.bak '/^version:/d' pubspec.yaml && rm pubspec.yaml.bak
          printf '\nversion: %s\n' "$VERSION" >> pubspec.yaml
      - name: Archive
        working-directory: ${{ inputs.app-dir }}
        env:
          # Ad hoc signing only; Infra's app-store.yml signs for distribution.
          TEAM_ID: MZMZBQPXAR
        # Signed ad hoc, which keeps the entitlements without a development
        # certificate.
        run: |
          mise x -- flutter build ios --release --config-only --no-codesign
          xcrun xcodebuild archive \
            -clonedSourcePackagesDirPath "$PWD/build/ios/SourcePackages" \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk iphoneos -destination generic/platform=iOS \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES
      - id: pack
        name: Check and pack the archive
        working-directory: ${{ inputs.app-dir }}/build/ios/archive
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_NUMBER: ${{ needs.plan.outputs.build-number }}
        run: |
          app=Runner.xcarchive/Products/Applications/Runner.app
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$2"; }
          if [ "$(plist CFBundleShortVersionString "$app/Info.plist")" != "$VERSION" ] ||
            [ "$(plist CFBundleVersion "$app/Info.plist")" != "$BUILD_NUMBER" ]; then
            echo "::error::The archive does not have version $VERSION ($BUILD_NUMBER)."
            exit 1
          fi
          # An app with push notifications must keep them up to the upload.
          if grep -qs aps-environment ../../../ios/Runner/*.entitlements; then
            codesign -d --entitlements entitlements.plist --xml "$app"
            if ! plist aps-environment entitlements.plist; then
              echo "::error::The archive lost its push notification entitlement."
              exit 1
            fi
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          # A tar keeps the executable bits, which artifacts drop.
          tar -cf Runner.xcarchive.tar Runner.xcarchive
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-archive
          path: ${{ inputs.app-dir }}/build/ios/archive/Runner.xcarchive.tar
          if-no-files-found: error
          # Long enough for Infra to re-run the upload after a blocked App Store Connect.
          retention-days: 7

  app-store-request:
    # Infra's app-store.yml finds this artifact, checks it against apps.yaml on
    # its main branch, then uploads the archive and submits it with its own key.
    name: Request the App Store upload
    needs: [plan, ios-archive, promote]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.bundle-id != ''
      && needs.plan.outputs.ios == 'true'
      && (needs.ios-archive.result == 'success' || needs.promote.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # An environment with required reviewers also asks for approval here. Infra
    # does not check it: it checks that the request comes from the tag's own
    # release.yml run.
    environment: ${{ inputs.environment }}
    permissions: {}
    steps:
      - name: Write the request
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          MANUAL: ${{ needs.plan.outputs.manual }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_NUMBER: ${{ needs.plan.outputs.build-number }}
          PUSH: ${{ needs.ios-archive.outputs.push }}
          USES_NON_EXEMPT_ENCRYPTION: ${{ vars.APP_STORE_USES_NON_EXEMPT_ENCRYPTION }}
        run: |
          mkdir request
          jq -n '{mode: env.MODE, manual: (env.MANUAL == "true"), channel: env.CHANNEL,
            tag: env.TAG, version: env.VERSION, build_number: env.BUILD_NUMBER,
            push: (env.PUSH == "true"), uses_non_exempt_encryption: env.USES_NON_EXEMPT_ENCRYPTION}' \
            | tee request/request.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-store-request
          path: request/request.json
          if-no-files-found: error
          # Infra's finder looks back three days.
          retention-days: 3
          overwrite: true

  app-store:
    # Mirrors the result of Infra's run for this request.
    name: App Store (Infra)
    needs: app-store-request
    # app-store-request always has a skipped need (ios-archive or promote).
    if: ${{ !cancelled() && needs.app-store-request.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions: {}
    steps:
      - name: Wait for Infra's App Store run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export TITLE="App Store $GITHUB_REPOSITORY run $GITHUB_RUN_ID"
          api="repos/SilverNETGroupSGGW/Infra/actions/workflows/app-store.yml/runs?event=workflow_dispatch&per_page=50"
          # Newest first: a re-dispatched run replaces an older one.
          query='first(.workflow_runs[] | select(.display_title == env.TITLE)) | "\(.status) \(.conclusion) \(.html_url)"'
          # Infra's finder dispatches the run within about 15 minutes; the run
          # itself takes up to two hours behind other releases of the app.
          find_deadline=$((SECONDS + 45 * 60))
          deadline=$((SECONDS + 170 * 60))
          url=
          echo "Waiting for \"$TITLE\" in Infra's App Store workflow."
          while :; do
            # A failed request is retried at the next poll.
            if run=$(gh api "$api" --jq "$query") && [ -n "$run" ]; then
              read -r status conclusion run_url <<< "$run"
              if [ -z "$url" ]; then
                url=$run_url
                echo "Infra's App Store run: $url" | tee -a "$GITHUB_STEP_SUMMARY"
              fi
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  echo "Ended by success: $url"
                  exit 0
                fi
                echo "::error::Ended by failure: Infra's App Store run ended with $conclusion: $url. An Infra admin re-runs it; then re-run this job."
                exit 1
              fi
            fi
            if [ -z "$url" ] && ((SECONDS >= find_deadline)); then
              echo "::error::Ended by deadline: no \"$TITLE\" run in Infra after 45 minutes. The finder is late, or the app has no app_store entry on Infra main."
              exit 1
            fi
            if ((SECONDS >= deadline)); then
              echo "::error::Ended by deadline: $url has not finished after 170 minutes."
              exit 1
            fi
            sleep 60
          done

  pages:
    name: GitHub Pages
    needs: [plan, publish, promote, rename]
    if: >-
      ${{ !cancelled() && inputs.pages && github.event.repository.has_pages
      && needs.plan.outputs.manual != 'true'
      && (needs.publish.result == 'success' || needs.promote.result == 'success') }}
    permissions:
      contents: read # read the releases and their web builds
      pages: write # publish the site
      id-token: write # authenticate the Pages deployment (OIDC)
    uses: $/.github/workflows/flutter-pages.yml
