# actionlint 1.7.12 does not know these newer workflow features yet
# (rhysd/actionlint#745, #657 and #711).
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - 'unexpected key "cache-mode" for "workflow" section'
      - 'unexpected key "queue" for "concurrency" section'
      - 'reusable workflow call "\$/\.github/workflows/[^"]+" at "uses" is not following the format'
      - 'property "workflow_(repository|sha)" is not defined in object type'
